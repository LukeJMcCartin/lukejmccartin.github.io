---
layout: default
---

<div class="post-content">
  <h1>
    {{ page.title }}
  </h1>
  {% if site.hide_post_date != true %}
    {% include post-date.html %}
  {% endif %}
  {% if page.image %}
    <div class="featured-image">
      <img src="{{ '/assets/img/' | append: page.image | relative_url }}" alt="{{ page.title | escape }}">
    </div>
  {% endif %}
  <article>
    {{ content }}
  </article>
  {% if site.data.settings.disqus.comments %}
    {% include disqus.html %}
  {% endif %}
</div>
